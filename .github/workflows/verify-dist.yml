name: Verify dist

# Package-specific verification of an already-built wheel + sdist artifact.
# Called by CI for every PR/push and by the publish workflow before upload,
# so the same job checks both the candidate and the actual release bytes.

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Artifact holding exactly one wheel and one sdist"
        required: true
        type: string
      tag-name:
        description: "Release tag the version must match (empty outside releases)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.12.20"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/dist
      - name: Verify wheel and sdist
        env:
          DIST_DIR: ${{ runner.temp }}/dist
          TAG_NAME: ${{ inputs.tag-name }}
        run: |
          args=("$DIST_DIR" --report "$RUNNER_TEMP/verify-dist.json")
          if [ -n "$TAG_NAME" ]; then args+=(--tag "$TAG_NAME"); fi
          uv run --no-project --python 3.12 python scripts/verify_dist.py "${args[@]}"
      - name: Check dist with the publisher's own image (no upload)
        # The image the pinned publish action runs, with its upload entrypoint
        # replaced by `twine check`: no network, read-only, no credentials.
        # Must match publish.yml's action pin (tests/test_verify_dist.py checks).
        env:
          DIST_DIR: ${{ runner.temp }}/dist
          PUBLISHER_IMAGE: ghcr.io/pypa/gh-action-pypi-publish:dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        run: |
          docker pull --quiet "$PUBLISHER_IMAGE"
          docker run --rm --network none --read-only -v "$DIST_DIR:/dist:ro" \
            --entrypoint python "$PUBLISHER_IMAGE" -c \
            "import importlib.metadata as m; print({p: m.version(p) for p in ('twine', 'packaging')})"
          docker run --rm --network none --read-only -v "$DIST_DIR:/dist:ro" \
            --entrypoint sh "$PUBLISHER_IMAGE" -c 'twine check --strict /dist/*.whl /dist/*.tar.gz'
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ inputs.artifact-name }}-verification
          path: ${{ runner.temp }}/verify-dist.json
          if-no-files-found: error
