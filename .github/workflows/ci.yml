name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Required check: lint ────────────────────────────────────────────
  # CONTRACT: org ruleset requires this exact check name
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.12.20"
          python-version: "3.12"
          enable-cache: true
          cache-suffix: ${{ github.workflow }}-${{ github.job }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check src/ tests/ scripts/
      - name: Ruff format
        run: uv run ruff format --check src/ tests/ scripts/

  # ── Required check: typecheck ───────────────────────────────────────
  # CONTRACT: org ruleset requires this exact check name
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.12.20"
          python-version: "3.12"
          enable-cache: true
          cache-suffix: ${{ github.workflow }}-${{ github.job }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Mypy
        run: uv run mypy --strict src/navi_sanitize/ scripts/

  # ── Test matrix (NOT a required check) ──────────────────────────────
  test-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.12.20"
          enable-cache: true
          cache-suffix: ${{ github.workflow }}-${{ github.job }}-${{ matrix.python-version }}
      - name: Install dependencies
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv sync --frozen --python "$PYTHON_VERSION"
      - name: Run tests with coverage
        run: |
          uv pip install coverage
          uv run coverage run -m pytest tests/ -v --benchmark-disable
          uv run coverage xml -o coverage.xml --include='src/navi_sanitize/**'
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
      - name: Notify Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          run_command: send-notifications
          fail_ci_if_error: false

  # ── Required check: test (aggregator) ───────────────────────────────
  # CONTRACT: org ruleset requires this exact check name
  test:
    needs: test-run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check matrix results
        run: |
          if [ "${{ needs.test-run.result }}" != "success" ]; then
            echo "::error::Test matrix failed"
            exit 1
          fi

  # ── Required check: security ────────────────────────────────────────
  # CONTRACT: org ruleset requires this exact check name
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.12.20"
          python-version: "3.12"
          enable-cache: true
          cache-suffix: ${{ github.workflow }}-${{ github.job }}
      - name: Export audit inputs from uv.lock
        run: |
          # Runtime scope: the package declares no dependencies; fail if that changes.
          uv export --quiet --frozen --no-default-groups --no-emit-project --no-header \
            --format requirements.txt -o "$RUNNER_TEMP/runtime-requirements.txt"
          if grep -qvE '^[[:space:]]*(#|$)' "$RUNNER_TEMP/runtime-requirements.txt"; then
            echo "::error::Unexpected runtime dependencies"
            cat "$RUNNER_TEMP/runtime-requirements.txt"
            exit 1
          fi
          # Toolchain scope: every locked dev and docs package, hash-pinned.
          uv export --quiet --frozen --all-groups --no-emit-project --no-header \
            --format requirements.txt -o "$RUNNER_TEMP/audit-requirements.txt"
          sha256sum uv.lock "$RUNNER_TEMP/audit-requirements.txt"
      - name: pip-audit (locked dev and docs dependencies)
        # Audits exactly the exported pins; no resolution, fails on any skip.
        run: >-
          uvx pip-audit==2.9.0 --strict --disable-pip --require-hashes
          --progress-spinner off -r "$RUNNER_TEMP/audit-requirements.txt"

  # ── Required check: quality-gate ────────────────────────────────────
  # CONTRACT: org ruleset requires this exact check name
  # Fails unless every prerequisite succeeded (failed, cancelled and skipped all fail).
  quality-gate:
    needs: [test, lint, typecheck, security, build, verify-dist, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check all required jobs passed
        run: |
          for result in \
            "${{ needs.test.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs.security.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.verify-dist.result }}" \
            "${{ needs.docs.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::Required job failed: $result"
              exit 1
            fi
          done

  # ── Build the candidate wheel and sdist ─────────────────────────────
  build:
    needs: [lint, typecheck, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.12.20"
          python-version: "3.12"
          enable-cache: true
          cache-suffix: ${{ github.workflow }}-${{ github.job }}
      - name: Build wheel and sdist
        run: uv build
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ci-dist
          path: dist/
          if-no-files-found: error

  # ── Verify the exact built artifacts (same job the publish path runs) ──
  verify-dist:
    needs: [build]
    uses: ./.github/workflows/verify-dist.yml
    with:
      artifact-name: ci-dist

  # ── Docs build and site checks (never deploys) ──────────────────────
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.12.20"
          python-version: "3.12"
          enable-cache: true
          cache-suffix: ${{ github.workflow }}-${{ github.job }}
      - name: Install docs dependencies
        run: uv sync --frozen --group docs
      - name: Build and check site
        run: uv run python scripts/build_docs.py --out "$RUNNER_TEMP/site"
