[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navi_sanitize"]

[tool.hatch.build.targets.sdist]
# An explicit allowlist: repository automation, agent notes, local caches and
# the whitepaper binary stay out. pyproject.toml, README and LICENSE are implicit.
only-include = [
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "GOVERNANCE.md",
    "SECURITY.md",
    "docs",
    "examples",
    "fuzz",
    "scripts",
    "src",
    "tests",
    "uv.lock",
    "zensical.toml",
]
exclude = ["/docs/plans", "/docs/whitepaper"]

[project]
name = "navi-sanitize"
version = "0.2.2"
description = "Deterministic sanitization for untrusted text: strips invisible and control characters, applies NFKC and replaces common homoglyphs. No dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Project Navi LLC" }
]
maintainers = [
    { name = "Nelson Spence" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Text Processing :: Filters",
    "Typing :: Typed",
]
keywords = [
    "sanitization",
    "security",
    "unicode",
    "homoglyph",
    "injection",
    "invisible-characters",
    "llm",
    "prompt-injection",
]

[project.urls]
Repository = "https://github.com/Project-Navi/navi-sanitize"
Issues = "https://github.com/Project-Navi/navi-sanitize/issues"
Changelog = "https://github.com/Project-Navi/navi-sanitize/blob/main/CHANGELOG.md"
Documentation = "https://docs.projectnavi.ai/navi-sanitize"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "hypothesis>=6.168.0",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
]
docs = [
    "zensical>=0.0.63",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "RUF", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
